name: E2E

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: 1
  NEXT_TELEMETRY_DISABLED: 1
  SKIP_ENV_VALIDATION: 1

jobs:
  playwright:
    name: Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter app exec playwright install --with-deps

      # Through turbo, not `pnpm --filter`: the `test:e2e` task depends on
      # `build`, and Playwright now boots the production server (`next start`).
      # Calling the package script directly would skip the build.
      - name: Run E2E
        env:
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          BACKEND_URL: http://localhost:4000
        run: pnpm exec turbo run test:e2e --filter=app

      - name: Upload report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/app/playwright-report
          retention-days: 14
